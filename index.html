<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Strict Content Security Policy -->
    <!-- In development: Vite transforms this to allow localhost WebSocket for HMR -->
    <!-- In production: Stays strict with connect-src 'none' -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' blob: data:; img-src 'self' blob: data:; media-src 'self' blob: data:; font-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval' 'unsafe-inline' blob:; script-src-elem 'self' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; manifest-src 'self';"
    />

    <!-- Privacy and security -->
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="index, follow" />

    <!-- Primary Meta Tags -->
    <title>Free Online File Converter - 100% Local & Private | LocalConvert</title>
    <meta
      name="title"
      content="Free Online File Converter - 100% Local & Private | LocalConvert"
    />
    <meta
      name="description"
      content="Convert files instantly in your browser. Open-source, privacy-focused converter with zero uploads. Works offline. Supports images, audio, video & documents."
    />
    <meta
      name="keywords"
      content="file converter, online file converter, free converter, local file converter, privacy file converter, offline converter, browser converter, client-side converter, no upload converter, open source converter, image converter, audio converter, video converter, document converter, PNG to JPG, MP3 converter, PDF converter, convert files online, secure file converter, private converter"
    />
    <meta name="author" content="LocalConvert" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="canonical" href="https://localconvert.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://localconvert.com/" />
    <meta property="og:title" content="Free Online File Converter - 100% Local & Private" />
    <meta
      property="og:description"
      content="Convert files instantly in your browser. Open-source, privacy-focused converter with zero uploads. Works offline."
    />
    <meta property="og:image" content="https://localconvert.com/icon-512.png" />
    <meta property="og:site_name" content="LocalConvert" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://localconvert.com/" />
    <meta property="twitter:title" content="Free Online File Converter - 100% Local & Private" />
    <meta
      property="twitter:description"
      content="Convert files instantly in your browser. Open-source, privacy-focused converter with zero uploads. Works offline."
    />
    <meta property="twitter:image" content="https://localconvert.com/icon-512.png" />

    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Structured Data (JSON-LD) for Rich Search Results -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "LocalConvert",
        "alternateName": "Free Online File Converter",
        "url": "https://localconvert.com",
        "description": "Convert files instantly in your browser. Open-source, privacy-focused file converter with zero uploads. Works completely offline.",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Web Browser",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "featureList": [
          "Convert images, audio, video, and documents",
          "100% client-side processing",
          "No file uploads required",
          "Works completely offline",
          "Open-source software",
          "Privacy-focused",
          "No tracking or data collection",
          "Supports multiple file formats"
        ],
        "screenshot": "https://localconvert.com/icon-512.png",
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "5",
          "ratingCount": "1",
          "bestRating": "5",
          "worstRating": "1"
        },
        "keywords": "file converter, online converter, free converter, local converter, privacy converter, offline converter, browser converter, open source"
      }
    </script>

    <!-- Apply theme immediately to prevent flash -->
    <script>
      ;(function () {
        const stored = localStorage.getItem('app-theme')
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.setAttribute('data-theme', stored)
        } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
          document.documentElement.setAttribute('data-theme', 'light')
        } else {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
